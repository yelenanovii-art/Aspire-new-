# Build + security configuration for Netlify.
#
# The CSP below is strict: script-src is 'self' with no 'unsafe-inline'. That
# works because every inline <script> in the build is type="application/ld+json"
# (a data block, not executable JS), verified at build time. If you ever add an
# inline executable <script>, this CSP will block it — hash it or move it to a
# file rather than loosening the policy.
#
# Fonts are self-hosted, so the policy names no external origin at all: nothing
# on any page may talk to a third party. If you later add an embed (a booking
# widget, analytics), it will be blocked until you add its origin here, which
# is the intended behaviour — add the one origin, not a wildcard.

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# scripts/prerender.mjs drives a headless Chrome to write static HTML per
# route, and deliberately fails the build rather than shipping a JS-only site
# if it cannot find one. Netlify's image has no Chrome, so this plugin
# installs one and exports CHROME_PATH, which findChrome() looks for.
[[plugins]]
  package = "netlify-plugin-chromium"

# ── Security headers, applied to every response ─────────────────────────────
[[headers]]
  for = "/*"
  [headers.values]
    # 'unsafe-inline' appears ONLY in style-src, because React writes inline
    # style attributes (e.g. style={{ '--delay': '60ms' }}). Style injection is
    # far lower risk than script injection, and script-src stays strict.
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:; media-src 'self'; connect-src 'self'; form-action 'self'; frame-ancestors 'none'; base-uri 'self'; object-src 'none'; upgrade-insecure-requests"

    # Two years, all subdomains. Do NOT add "preload" until you are certain
    # every current and future subdomain will always serve HTTPS: preload lists
    # are slow and painful to get removed from.
    Strict-Transport-Security = "max-age=63072000; includeSubDomains"

    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Cross-Origin-Opener-Policy = "same-origin"
    Cross-Origin-Resource-Policy = "same-origin"

    # The site uses none of these, so switch them all off rather than leaving
    # them available to injected code.
    Permissions-Policy = "accelerometer=(), autoplay=(), camera=(), display-capture=(), encrypted-media=(), fullscreen=(self), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), midi=(), payment=(), usb=(), interest-cohort=()"

# ── Caching ─────────────────────────────────────────────────────────────────
# Vite fingerprints these filenames, so they can be cached permanently.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# HTML must revalidate, or a deploy will not reach people who have visited.
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
