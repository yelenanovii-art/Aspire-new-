    <!-- Inter Tight sets every heading; Inter carries body text (one
         superfamily, so nothing clashes). Bodoni Moda is loaded only for the
         "Aspire." wordmark — see --wordmark in index.css. -->
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Inter+Tight:wght@500;600;700;800&family=JetBrains+Mono:wght@400;500&family=Bodoni+Moda:opsz,wght@6..96,400..600&display=swap"

    />

         public/brand/aspire-logo-light.png). The small sizes carry no accent
         dot: at 16px it would be a single pixel. -->

    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

  <body>
    <div id="root"></div>

    <!-- ── Netlify Forms registration ───────────────────────────────────────
         Netlify discovers forms by scanning deployed HTML at build time, so it
         can never see a form React only renders at runtime. This static
         declaration lists every field the app can submit; the real UI lives in
         src/components/LeadForm.jsx and POSTs back here with a matching
         `form-name`. Keep the field list in sync with LeadForm's FIELD_DEFS.
         Harmless if you use Formspree instead (set VITE_FORM_ENDPOINT). -->
    <form name="aspire-lead" data-netlify="true" netlify-honeypot="bot-field" hidden aria-hidden="true">
      <input type="text" name="bot-field" />
      <input type="text" name="name" />
      <input type="text" name="company" />
      <input type="text" name="email" />
      <input type="text" name="phone" />
      <input type="text" name="interest" />
      <textarea name="message"></textarea>
      <input type="text" name="_subject" />
      <input type="text" name="source" />
    </form>

    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
